name: Build Firmware

on:
  workflow_dispatch:
#  push:
#    branches:
#      - main
#  pull_request:
#    branches:
#      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 0  

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make python3 yq unzip wget gcc-arm-none-eabi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    - name: Cache Silicon Labs Tools
      uses: actions/cache@v3
      with:
        path: silabs_tools
        key: silabs-tools-2025.6.2

    - name: Cache Telink Tools
      uses: actions/cache@v3
      with:
        path: telink_tools
        key: telink-tools-v3.7.2.0

    - name: Cache Python Virtual Environment
      uses: actions/cache@v3
      with:
        path: .venv
        key: python-venv-${{ hashFiles('requirements.txt') }}

    - name: Install SDK and Toolchain
      run: |
        make telink/tools/all
        make setup_venv

    - name: Build Moes TS0011 Router (1-gang)
      run: |
        source .venv/bin/activate
        BOARD=SWITCH_MOES_ALL_TS0011 DEVICE_TYPE=router make board/build
        ls -lh bin/router/SWITCH_MOES_ALL_TS0011/

    - name: Build Moes TS0012 Router (2-gang)
      run: |
        source .venv/bin/activate
        BOARD=SWITCH_MOES_ALL_TS0012 DEVICE_TYPE=router make board/build
        ls -lh bin/router/SWITCH_MOES_ALL_TS0012/

    - name: Build Moes TS0013 Router (3-gang)
      run: |
        source .venv/bin/activate
        BOARD=SWITCH_MOES_ALL_TS0013 DEVICE_TYPE=router make board/build
        ls -lh bin/router/SWITCH_MOES_ALL_TS0013/

    - name: Update Z2M converters
      run: |
        source .venv/bin/activate
        make tools/update_converters

    - name: Update ZHA quirks
      run: |
        source .venv/bin/activate
        make tools/update_zha_quirk

    - name: Update HOMEd extensions
      run: |
        source .venv/bin/activate
        make tools/update_homed_extension

    - name: Update supported_devices.md
      run: |
        source .venv/bin/activate
        make tools/update_supported_devices

    - name: Commit changes
      run: |
        source .venv/bin/activate
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add bin/* zigbee2mqtt/* zha/* homed/* docs/supported_devices.md
        git diff --cached --quiet || git commit -m "Update firmware files, converters, quirks, extensions and supported devices list"
        make tools/freeze_ota_links
        git add zigbee2mqtt/*
        git diff --cached --quiet || git commit -m "Freeze links in OTA index files"
        git push
